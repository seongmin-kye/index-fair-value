name: update

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 평일 22:30 UTC (미국 장 마감 뒤, 한국 07:30): 종가
    - cron: "*/30 13-20 * * 1-5"  # 미국 장중 30분마다 (13:00~20:30 UTC; 서머타임이 아닐 때 마지막 30분은 22:30 종가 갱신이 채움): 주가
    - cron: "0 3 * * 6"       # 토요일 03:00 UTC: 구성 종목 · 실적 · 컨센서스 전체
  workflow_dispatch:
    inputs:
      mode:
        description: "prices | full | backfill"
        default: prices

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: 주가
        run: python3 scripts/update.py prices
      - name: 구성 종목 · 실적 · 컨센서스
        if: github.event.schedule == '0 3 * * 6' || inputs.mode == 'full'
        run: |
          python3 scripts/update.py holdings
          python3 scripts/update.py full
          python3 scripts/update.py prices
      - name: 앞쪽 이력 채우기 (한 번)
        if: inputs.mode == 'backfill'
        run: python3 scripts/update.py backfill
      - name: 페이지 빌드
        run: python3 scripts/build.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) ${{ github.event.schedule || inputs.mode }}"
          git pull --rebase -q || true
          git push
